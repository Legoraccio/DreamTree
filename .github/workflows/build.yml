# Builds Mangrove on macOS and on Windows and runs the tests of the shared core on both.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "screenshot*.png"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app (Apple silicon + Intel)
        run: ./build-mac.sh
      - name: Core tests
        run: ./tools/coretest/run.sh
      - name: Patch tests
        run: ./tools/patchtest/run.sh 60
      - name: Package
        run: ditto -c -k --keepParent bin/Mangrove.app bin/Mangrove-macOS.zip
      # Published as it is, not inside a zip of GitHub's own (which the Mac's Archive Utility can't open): the
      # artifact is this file, Mangrove-macOS.zip, and opens with a double click.
      - uses: actions/upload-artifact@v7
        with:
          path: bin/Mangrove-macOS.zip
          archive: false
      - name: Interface smoke test (window snapshots)
        run: ./tools/uitest/mac-snapshots.sh build/snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-snapshots
          path: build/snapshots

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        shell: powershell
        run: ./build.ps1
      - name: Core tests
        shell: powershell
        run: ./tools/coretest/run.ps1
      - name: Patch tests
        shell: powershell
        run: ./tools/patchtest/run.ps1 -Cases 60
      - uses: actions/upload-artifact@v4
        with:
          name: Mangrove-Windows
          path: bin/Mangrove.exe
      - name: Interface smoke test (window snapshots)
        shell: powershell
        run: ./tools/uitest/win-snapshots.ps1 build/snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-snapshots
          path: build/snapshots
