# Builds Mangrove on macOS, Windows and Linux and runs the tests of the shared core on each.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "screenshot*.png", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app (Apple silicon + Intel)
        run: ./build-mac.sh
      - name: Core tests
        run: ./tools/coretest/run.sh
      - name: Patch tests
        run: ./tools/patchtest/run.sh 60
      - name: Package
        run: ditto -c -k --keepParent bin/Mangrove.app bin/Mangrove-macOS.zip
      # Published as it is, not inside a zip of GitHub's own (which the Mac's Archive Utility can't open): the
      # artifact is this file, Mangrove-macOS.zip, and opens with a double click.
      - uses: actions/upload-artifact@v7
        with:
          path: bin/Mangrove-macOS.zip
          archive: false
      - name: Interface smoke test (window snapshots)
        run: ./tools/uitest/mac-snapshots.sh build/snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-snapshots
          path: build/snapshots

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        shell: powershell
        run: ./build.ps1
      - name: Core tests
        shell: powershell
        run: ./tools/coretest/run.ps1
      - name: Patch tests
        shell: powershell
        run: ./tools/patchtest/run.ps1 -Cases 60
      - uses: actions/upload-artifact@v4
        with:
          name: Mangrove-Windows
          path: bin/Mangrove.exe
      - name: Interface smoke test (window snapshots)
        shell: powershell
        run: ./tools/uitest/win-snapshots.ps1 build/snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-snapshots
          path: build/snapshots
      - name: Single instance
        shell: powershell
        run: ./tools/uitest/win-single-instance.ps1

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4, libadwaita and the test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            libcurl4-openssl-dev libsecret-1-dev librsvg2-common fonts-cantarell xvfb xauth dbus gnome-keyring
      - name: Build the app
        run: ./build-linux.sh
      # In a session with a keyring (unlocked with a throwaway password), so that the tokens' store is tested too.
      - name: Core tests
        run: dbus-run-session -- bash -c 'printf mangrove-ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && MANGROVE_TEST_SECRETS=1 ./tools/coretest/run.sh'
      - name: Patch tests
        run: ./tools/patchtest/run.sh 60
      - name: Package
        run: |
          mkdir -p build/package/Mangrove
          cp bin/mangrove src/linux/data/install.sh src/linux/data/io.github.legoraccio.Mangrove.desktop \
            src/linux/data/icons/scalable/apps/io.github.legoraccio.Mangrove.svg build/package/Mangrove/
          tar -C build/package -czf bin/Mangrove-Linux.tar.gz Mangrove
      # As it is, like the macOS zip: the artifact is this file, which keeps the program executable.
      - uses: actions/upload-artifact@v7
        with:
          path: bin/Mangrove-Linux.tar.gz
          archive: false
      - name: Interface smoke test (window snapshots)
        run: ./tools/uitest/linux-snapshots.sh build/snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-snapshots
          path: build/snapshots
      - name: Single instance
        run: ./tools/uitest/linux-single-instance.sh
